<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kantor AI Virtual ID — Masuk</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="login-body">
  <div class="login-stage">
    <div class="login-ambient" aria-hidden="true"></div>

    <div class="login-lamp" aria-hidden="true">
      <svg viewBox="0 0 220 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lampu meja">
        <defs>
          <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#2b2f36" />
            <stop offset="1" stop-color="#12151a" />
          </linearGradient>
          <radialGradient id="bulb" cx="0.5" cy="0.45" r="0.6">
            <stop offset="0" stop-color="#fff6e2" />
            <stop offset="0.55" stop-color="#e1aa5d" />
            <stop offset="1" stop-color="#7a5320" />
          </radialGradient>
          <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#8a6a34" />
            <stop offset="0.45" stop-color="#e8c583" />
            <stop offset="1" stop-color="#7d5c2c" />
          </linearGradient>
        </defs>

        <ellipse cx="110" cy="318" rx="76" ry="10" fill="#000" opacity="0.45" />

        <ellipse cx="110" cy="306" rx="52" ry="14" fill="url(#shade)" stroke="url(#brass)" stroke-width="2" />
        <ellipse cx="110" cy="301" rx="52" ry="14" fill="url(#shade)" stroke="url(#brass)" stroke-width="2" />

        <path d="M108 300 L100 190" stroke="url(#brass)" stroke-width="7" stroke-linecap="round" />
        <path d="M100 190 L128 150" stroke="url(#brass)" stroke-width="7" stroke-linecap="round" />

        <circle cx="100" cy="192" r="8" fill="url(#brass)" />
        <circle cx="128" cy="150" r="7" fill="url(#brass)" />

        <path d="M96 152 L164 152 L146 206 L114 206 Z" fill="url(#shade)" stroke="url(#brass)" stroke-width="2.5" stroke-linejoin="round" />
        <ellipse cx="130" cy="152" rx="34" ry="6" fill="#0c0e11" stroke="url(#brass)" stroke-width="2" />

        <circle class="lamp-halo" cx="130" cy="206" r="46" fill="url(#bulb)" opacity="0.26" />
        <circle class="lamp-bulb" cx="130" cy="206" r="15" fill="url(#bulb)" />
      </svg>
      <div class="lamp-light"></div>
    </div>

    <section class="login-card">
      <p class="login-eyebrow">KANTOR AI VIRTUAL ID</p>
      <h1 id="login-title">Welcome</h1>
      <p class="login-sub" id="login-sub">Sign in to get started</p>

      <form id="login-form" class="login-form" autocomplete="off">
        <label class="field">
          <span>Nama</span>
          <span class="field-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-5 0-9 2.5-9 5.5V21h18v-1.5c0-3-4-5.5-9-5.5Z"/></svg>
            <input type="text" id="login-name" name="name" autocomplete="username" placeholder="Username or Email" required>
          </span>
        </label>

        <label class="field">
          <span>Sandi</span>
          <span class="field-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V8a5 5 0 0 1 10 0v2h1a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1-2-2h1Zm2 0h6V8a3 3 0 0 0-6 0v2Z"/></svg>
            <input type="password" id="login-password" name="password" autocomplete="current-password" placeholder="Password" required>
          </span>
        </label>

        <label class="field" id="invite-field" hidden>
          <span>Kode undangan</span>
          <span class="field-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3Zm-1 7h2v6h-2V9Zm0-3h2v2h-2V6Z"/></svg>
            <input type="text" id="register-invite" name="invite" placeholder="Dari pemilik, misal UMKM2026">
          </span>
        </label>

        <div class="login-row">
          <button class="link-button" id="forgot-button" type="button">Forgot password?</button>
        </div>

        <button class="button login-submit" id="login-submit" type="submit">Sign In</button>

        <div class="login-switch">
          <span id="switch-text">Belum punya akun?</span>
          <button class="link-button" id="switch-button" type="button">Sign Up</button>
        </div>

        <div class="login-divider"><span>Or continue with</span></div>

        <div class="login-social">
          <button class="social-button" type="button" data-social="google" aria-label="Masuk dengan Google">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.25 1.4-1.7 4.1-5.5 4.1a5.9 5.9 0 0 1 0-11.8c1.9 0 3.2.8 4 1.5l2.7-2.6A9.3 9.3 0 0 0 12 2.7a9.3 9.3 0 1 0 0 18.6c5.4 0 9-3.8 9-9.2 0-.6-.1-1-.2-1.5H12Z"/></svg>
          </button>
          <button class="social-button" type="button" data-social="facebook" aria-label="Masuk dengan Facebook">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#1877F2" d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 22 12Z"/></svg>
          </button>
          <button class="social-button" type="button" data-social="whatsapp" aria-label="Masuk dengan WhatsApp">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#25D366" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.5 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.4-.7-2.9-1.2-4.7-4.1-4.8-4.3-.2-.2-1.2-1.6-1.2-3s.7-2.1 1-2.4c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.1.1.3 0 .5l-.4.5c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.6-.1l.7-.9c.2-.2.4-.2.6-.1l1.9.9c.2.1.4.2.4.3.1.1.1.6-.1 1.2Z"/></svg>
          </button>
        </div>
      </form>

      <p class="login-error" id="login-error" role="alert" hidden></p>
      <p class="login-foot-note">Prototype gratis · hanya untuk uji coba</p>
    </section>
  </div>

  <script src="/login.js"></script>
</body>
</html>
