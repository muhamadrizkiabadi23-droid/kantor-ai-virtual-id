<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KANTOR AI ID — Masuk</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="login-body">

  <!-- Latar hidup: orb gradien + garis grid -->
  <div class="login-bg" aria-hidden="true">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>
    <div class="bg-grid"></div>
  </div>

  <div class="login-stage">

    <!-- Visual kiri: lampu meja beranimasi -->
    <div class="login-visual" aria-hidden="true">
      <div class="visual-glow"></div>
      <div class="login-lamp">
        <svg viewBox="0 0 220 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lampu meja">
          <defs>
            <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#2b2f36" />
              <stop offset="1" stop-color="#12151a" />
            </linearGradient>
            <radialGradient id="bulb" cx="0.5" cy="0.45" r="0.6">
              <stop offset="0" stop-color="#fff6e2" />
              <stop offset="0.55" stop-color="#e1aa5d" />
              <stop offset="1" stop-color="#7a5320" />
            </radialGradient>
            <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#8a6a34" />
              <stop offset="0.45" stop-color="#e8c583" />
              <stop offset="1" stop-color="#7d5c2c" />
            </linearGradient>
          </defs>

          <ellipse class="lamp-shadow" cx="110" cy="318" rx="76" ry="10" fill="#000" opacity="0.45" />

          <ellipse cx="110" cy="306" rx="52" ry="14" fill="url(#shade)" stroke="url(#brass)" stroke-width="2" />
          <ellipse cx="110" cy="301" rx="52" ry="14" fill="url(#shade)" stroke="url(#brass)" stroke-width="2" />

          <g class="lamp-arm">
            <path d="M108 300 L100 190" stroke="url(#brass)" stroke-width="7" stroke-linecap="round" />
            <path d="M100 190 L128 150" stroke="url(#brass)" stroke-width="7" stroke-linecap="round" />
            <circle cx="100" cy="192" r="8" fill="url(#brass)" />
            <circle cx="128" cy="150" r="7" fill="url(#brass)" />
          </g>

          <g class="lamp-head">
            <path d="M96 152 L164 152 L146 206 L114 206 Z" fill="url(#shade)" stroke="url(#brass)" stroke-width="2.5" stroke-linejoin="round" />
            <ellipse cx="130" cy="152" rx="34" ry="6" fill="#0c0e11" stroke="url(#brass)" stroke-width="2" />
            <circle class="lamp-halo" cx="130" cy="206" r="46" fill="url(#bulb)" opacity="0.26" />
            <circle class="lamp-bulb" cx="130" cy="206" r="15" fill="url(#bulb)" />
          </g>
        </svg>
        <div class="lamp-light"></div>
      </div>

      <div class="visual-caption">
        <span class="caption-dot"></span>
        <span>48 Karyawan AI · Siap Bekerja</span>
      </div>
    </div>

    <!-- Kartu formulir -->
    <section class="login-card" id="loginCard">
      <div class="card-shine" aria-hidden="true"></div>

      <p class="login-eyebrow">KANTOR AI VIRTUAL ID</p>
      <h1 id="login-title">Selamat Datang</h1>
      <p class="login-sub" id="login-sub">Masuk untuk mengelola tim AI Anda</p>

      <form id="login-form" class="login-form" autocomplete="off">
        <label class="field">
          <span>Nama</span>
          <span class="field-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-5 0-9 2.5-9 5.5V21h18v-1.5c0-3-4-5.5-9-5.5Z"/></svg>
            <input type="text" id="login-name" name="name" autocomplete="username" placeholder="Nama atau email" required>
          </span>
        </label>

        <label class="field">
          <span>Kata Sandi</span>
          <span class="field-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V8a5 5 0 0 1 10 0v2h1a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1-2-2h1Zm2 0h6V8a3 3 0 0 0-6 0v2Z"/></svg>
            <input type="password" id="login-password" name="password" autocomplete="current-password" placeholder="••••••••" required>
          </span>
        </label>

        <label class="field" id="invite-field" hidden>
          <span>Kode Undangan</span>
          <span class="field-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3Zm-1 7h2v6h-2V9Zm0-3h2v2h-2V6Z"/></svg>
            <input type="text" id="register-invite" name="invite" placeholder="Dari pemilik, mis. UMKM2026">
          </span>
        </label>

        <div class="login-row">
          <button class="link-button" id="forgot-button" type="button">Lupa kata sandi?</button>
        </div>

        <button class="button login-submit" id="login-submit" type="submit">
          <span class="submit-label">Masuk</span>
          <span class="submit-spinner" hidden></span>
        </button>

        <div class="login-switch">
          <span id="switch-text">Belum punya akun?</span>
          <button class="link-button" id="switch-button" type="button">Daftar</button>
        </div>
      </form>

      <p class="login-error" id="login-error" role="alert" hidden></p>
      <p class="login-foot-note">Prototype gratis · hanya untuk uji coba</p>
    </section>
  </div>

  <script src="./login.js"></script>
</body>
</html>
